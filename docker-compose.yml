# Arca: app + Postgres. Copy .env.example to .env and fill it in first.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://arca:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/arca
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:?set NUXT_AUTH_SECRET in .env}
      NUXT_BASE_URL: ${NUXT_BASE_URL:?set NUXT_BASE_URL in .env}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arca -d arca']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  data:
